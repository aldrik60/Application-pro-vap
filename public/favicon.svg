<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#fcf9f1"/>
      <stop offset="55%" stop-color="#f4ecd9"/>
      <stop offset="100%" stop-color="#e8dec5"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="200" fill="url(#shine)"/>

  <!-- "P" en serif italique élégant, légèrement décentré pour laisser la place à l'apostrophe -->
  <text
    x="220"
    y="380"
    text-anchor="middle"
    font-family="'Cormorant Garamond','EB Garamond','Garamond','Georgia',serif"
    font-size="420"
    font-weight="500"
    font-style="italic"
    fill="#1f1f24"
    letter-spacing="-12"
  >P</text>

  <!-- Apostrophe ochre, accent de marque -->
  <circle cx="362" cy="178" r="22" fill="#cb8002"/>
</svg>
